name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install pyinstaller psutil
      - name: Build exe
        run: pyinstaller --onefile --noconsole --name PTS-Benchmark main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTS-Benchmark-windows
          path: dist/PTS-Benchmark.exe
      - name: Create Release v0.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1 dist/PTS-Benchmark.exe --title "PTS Benchmark v0.1" --notes "Windows 10/11 exe - CPU + RAM + Disk + GPU + Stress test az 4 h (vlastny cas) + graf teploty / zatazenia + kontrola aktualizacii" || gh release upload v0.1 dist/PTS-Benchmark.exe --clobber
